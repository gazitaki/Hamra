<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamra Aksesuar Admin</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
body{ font-family:Arial, sans-serif; background:#111; color:white; margin:0; padding:12px; box-sizing:border-box; }
.card{ background:#222; padding:12px; margin-bottom:12px; border-radius:12px; box-sizing:border-box; }
input,select,button{ width:100%; padding:10px; margin-top:6px; border:none; border-radius:8px; box-sizing:border-box; font-size:14px; }
button{ cursor:pointer; font-weight:bold; }
.primary{ background:#8b1a2f; color:white; }
.deleteBtn{ background:#d63031; color:white; margin-top:5px; }
.passiveBtn{ background:#e17055; color:white; margin-top:5px; }
.iptalBtn{ background:#636e72; color:white; margin-top:8px; padding:10px; border-radius:8px; font-weight:bold; width:100%; border:none; cursor:pointer; font-size:14px; }

.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:15px; }
.statBox{ background:#1c1c1c; padding:12px 6px; border-radius:12px; text-align:center; font-size:12px; font-weight:bold; position:relative; }
.statBox b{ display:block; font-size:16px; margin-top:5px; color:#c4848e; }

.filterIcon{ position:absolute; top:4px; right:4px; background:#333; border:none; color:white; width:20px; height:20px; border-radius:4px; cursor:pointer; font-size:10px; display:flex; align-items:center; justify-content:center; }
.filterPanel{ display:none; position:absolute; top:30px; right:0; background:#222; border:1px solid #333; border-radius:10px; overflow:hidden; z-index:100; min-width:120px; box-shadow:0 4px 15px rgba(0,0,0,.5); }
.filterPanel.show{ display:block; }
.filterOption{ padding:8px 12px; font-size:12px; font-weight:bold; cursor:pointer; border-bottom:1px solid #333; text-align:left; }
.filterOption:last-child{ border-bottom:none; }
.filterOption:hover{ background:#2a2a2a; }
.filterOption.active{ color:#c4848e; }
.filterLabel{ font-size:9px; color:#888; margin-top:2px; display:block; }

#products{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.productImage{ width:100%; height:130px; object-fit:cover; border-radius:10px; background:#333; cursor:pointer; }
.productImage.pasif-img{ opacity:0.4; filter:grayscale(100%); }

.orderItem{ display:flex; gap:10px; align-items:center; background:#1a1a1a; padding:8px; border-radius:10px; margin-top:6px; }
.orderItem img{ width:60px; height:60px; object-fit:cover; border-radius:8px; background:#333; cursor:pointer; flex-shrink:0; }

.nextBtn{ margin-top:8px; padding:10px; border-radius:8px; font-weight:bold; border:none; cursor:pointer; width:100%; font-size:13px; }
.nextBtn-yeni{ background:linear-gradient(90deg,#f39c12,#e67e22); color:white; }
.nextBtn-odeme{ background:linear-gradient(90deg,#2980b9,#3498db); color:white; }
.waBtn{ background:#25d366; color:white; margin-top:8px; display:block; text-align:center; text-decoration:none; padding:10px; border-radius:8px; font-weight:bold; font-size:13px; box-sizing:border-box; }

.bolumBaslik{ background:#1c1c1c; padding:12px; border-radius:10px; margin-bottom:6px; font-size:14px; font-weight:bold; border-left:4px solid #8b1a2f; cursor:pointer; display:flex; align-items:center; justify-content:space-between; user-select:none; }
.bolumIcerik{ display:none; margin-bottom:10px; }
.bolumIcerik.show{ display:block; }
.countBadge{ background:#333; padding:2px 8px; border-radius:20px; font-size:11px; margin-left:8px; }

.arsivRow{ display:flex; justify-content:space-between; align-items:center; padding:10px; background:#1a1a1a; border-radius:10px; margin-bottom:6px; font-size:13px; }
.arsivRow .detail{ color:#aaa; font-size:11px; margin-top:2px; }
.arsivRow .tutar{ color:#c4848e; font-weight:bold; font-size:14px; }

#loginPage{ max-width:400px; margin:60px auto; padding:20px; }
#adminContent{ display:none; }

.zoomModal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:999; justify-content:center; align-items:center; }
.zoomModal.show{ display:flex; }
.zoomModal img{ max-width:95vw; max-height:95vh; object-fit:contain; border-radius:10px; }
.zoomClose{ position:absolute; top:14px; right:14px; width:38px; height:38px; background:white; color:#111; border:none; border-radius:50%; font-size:22px; font-weight:900; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:1000; }

.orderCard{ background:#222; margin-bottom:8px; border-radius:12px; overflow:hidden; border:1px solid #333; }
.orderHeader{ padding:12px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; user-select:none; }
.orderHeader:active{ background:#2a2a2a; }
.orderHeaderLeft{ display:flex; flex-direction:column; gap:3px; }
.orderHeaderTitle{ font-size:13px; font-weight:700; color:white; }
.orderHeaderSub{ font-size:11px; color:#aaa; }
.orderHeaderRight{ display:flex; align-items:center; gap:8px; }
.orderTotal{ font-size:15px; font-weight:700; color:#c4848e; }
.orderArrow{ font-size:12px; color:#666; transition:transform .2s; }
.orderArrow.open{ transform:rotate(180deg); }
.orderBody{ display:none; padding:0 12px 12px; border-top:1px solid #333; }
.orderBody.show{ display:block; }
</style>
</head>
<body>

<div class="zoomModal" id="zoomModal" onclick="closeZoom()">
  <button class="zoomClose" onclick="closeZoom()">×</button>
  <img id="zoomImg" onclick="event.stopPropagation()">
</div>

<div id="loginPage" class="card">
  <h2 style="text-align:center;color:#c4848e;margin-top:0;">🔐 Hamra Aksesuar Giriş</h2>
  <input id="loginEmail" type="email" placeholder="E-posta adresiniz">
  <input id="loginPassword" type="password" placeholder="Şifreniz">
  <button class="primary" style="margin-top:15px;" onclick="loginAdmin()">GİRİŞ YAP</button>
  <p id="loginError" style="color:#d63031;font-size:13px;font-weight:bold;text-align:center;margin-top:10px;"></p>
</div>

<div id="adminContent">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
    <h2 style="margin:0;font-size:20px;">🧑‍💼 Admin Panel</h2>
    <button onclick="logoutAdmin()" style="width:auto;background:#333;padding:6px 12px;font-size:12px;margin:0;">🚪 Çıkış</button>
  </div>

  <div class="stats">
    <div class="statBox">📦 Sipariş<b id="totalOrders">0</b></div>
    <div class="statBox">🛒 Ürün<b id="totalProducts">0</b></div>
    <div class="statBox">
      💰 Kazanç<b id="totalMoney">0₺</b>
      <span class="filterLabel" id="filterLabel">Bu Hafta</span>
      <button class="filterIcon" onclick="toggleFilter(event)">☰</button>
      <div class="filterPanel" id="filterPanel">
        <div class="filterOption active" onclick="setFilter('hafta','Bu Hafta',this)">Bu Hafta</div>
        <div class="filterOption" onclick="setFilter('ay','Bu Ay',this)">Bu Ay</div>
        <div class="filterOption" onclick="setFilter('yillik','Bu Yıl',this)">Bu Yıl</div>
        <div class="filterOption" onclick="setFilter('hepsi','Tüm Zamanlar',this)">Tüm Zamanlar</div>
      </div>
    </div>
  </div>

  <div class="card" style="padding:4px;margin-bottom:12px;">
    <input id="searchOrder" placeholder="👤 Müşteri adı veya 📞 tel no ile ara..." oninput="render()">
  </div>

  <div class="bolumBaslik" style="border-left-color:#e17055" onclick="goBolum('yeni')">🟠 Yeni Siparişler <span class="countBadge" id="count-yeni">0</span></div>
  <div class="bolumIcerik show" id="body-yeni"></div>

  <div class="bolumBaslik" style="border-left-color:#0984e3" onclick="goBolum('odeme')">🟡 Ödeme Bekleyen <span class="countBadge" id="count-odeme">0</span></div>
  <div class="bolumIcerik" id="body-odeme"></div>

  <div class="bolumBaslik" style="border-left-color:#6c5ce7" onclick="goBolum('kargo')">🟣 Kargoda <span class="countBadge" id="count-kargo">0</span></div>
  <div class="bolumIcerik" id="body-kargo"></div>

  <div class="bolumBaslik" style="border-left-color:#d63031" onclick="goBolum('iptal')">❌ İptal Edilenler <span class="countBadge" id="count-iptal">0</span></div>
  <div class="bolumIcerik" id="body-iptal"></div>

  <div class="bolumBaslik" style="border-left-color:#8b1a2f" onclick="goBolum('arsiv')">📁 Arşiv <span class="countBadge" id="count-arsiv">0</span></div>
  <div class="bolumIcerik" id="body-arsiv"></div>

  <div class="card">
    <h3>📦 Ürün Ekle</h3>
    <input id="ad" placeholder="Ürün adı">
    <input id="fiyat" type="number" placeholder="Fiyat">
    <input id="resim" placeholder="Resim link">
    <input id="renk1" placeholder="1. Renk adı (örn: Gold) - opsiyonel">
    <input id="renk2" placeholder="2. Renk adı (örn: Gümüş) - opsiyonel">
    <select id="kategori">
      <option value="Xuping">Xuping</option>
      <option value="CM">CM</option>
      <option value="Set">Set</option>
      <option value="Küpe">Küpe</option>
      <option value="Kolye">Kolye</option>
      <option value="Bileklik">Bileklik</option>
      <option value="VIP">VIP</option>
    </select>
    <button class="primary" onclick="addProduct()">➕ EKLE</button>
  </div>

  <div class="bolumBaslik" style="border-left-color:#0984e3" onclick="goBolum('urunler')">📦 Ürün Listesi <span class="countBadge" id="count-urunler">0</span></div>
  <div class="bolumIcerik" id="body-urunler">
    <div id="products"></div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCurf07V_eEA3Oi1x-zY0MsD8kzZSamOjA",
  authDomain: "hamra-78810.firebaseapp.com",
  projectId: "hamra-78810",
  storageBucket: "hamra-78810.firebasestorage.app",
  messagingSenderId: "7432272923",
  appId: "1:7432272923:web:262ec502e15bb6e8bf0cbe"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let products = [];
let allOrders = [];
let activeFilter = "hafta";

auth.onAuthStateChanged(function(user){
  if(user){
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("adminContent").style.display = "block";
    startListeners();
  } else {
    document.getElementById("loginPage").style.display = "block";
    document.getElementById("adminContent").style.display = "none";
  }
});

function loginAdmin(){
  var email = document.getElementById("loginEmail").value;
  var pass = document.getElementById("loginPassword").value;
  var err = document.getElementById("loginError");
  err.innerText = "";
  auth.signInWithEmailAndPassword(email, pass).catch(function(e){ err.innerText = "Hatalı giriş: " + e.message; });
}

function logoutAdmin(){ auth.signOut(); }

function startListeners(){
  db.collection("products").onSnapshot(function(snap){
    products = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
    render();
  });
  db.collection("orders").orderBy("date","desc").onSnapshot(function(snap){
    allOrders = snap.docs.map(function(d){ return Object.assign({ _docId: d.id }, d.data()); });
    render();
  });
}

function openZoom(src){ document.getElementById("zoomImg").src=src; document.getElementById("zoomModal").classList.add("show"); document.body.style.overflow="hidden"; }
function closeZoom(){ document.getElementById("zoomModal").classList.remove("show"); document.body.style.overflow=""; }

function getRange(f){
  var now=new Date();
  if(f==="hafta"){ var day=now.getDay(),diff=(day===0)?6:day-1; var s=new Date(now); s.setHours(0,0,0,0); s.setDate(now.getDate()-diff); var e=new Date(s); e.setDate(s.getDate()+7); return {start:s,end:e}; }
  if(f==="ay") return {start:new Date(now.getFullYear(),now.getMonth(),1),end:new Date(now.getFullYear(),now.getMonth()+1,1)};
  if(f==="yillik") return {start:new Date(now.getFullYear(),0,1),end:new Date(now.getFullYear()+1,0,1)};
  return null;
}

function calcMoney(){
  var range=getRange(activeFilter); var t=0;
  allOrders.forEach(function(o){
    if(o.status==="iptal") return;
    if(range&&o.date){ var d=new Date(o.date); if(d<range.start||d>=range.end) return; }
    if(o.items) o.items.forEach(function(it){ t+=(it.qty||0)*(it.fiyat||0); });
  });
  return t;
}

function toggleFilter(e){ e.stopPropagation(); document.getElementById("filterPanel").classList.toggle("show"); }
function setFilter(key,label,el){
  activeFilter=key;
  document.getElementById("filterLabel").innerText=label;
  document.querySelectorAll(".filterOption").forEach(function(o){ o.classList.remove("active"); });
  el.classList.add("active");
  document.getElementById("totalMoney").innerText=calcMoney()+"₺";
}
document.addEventListener("click",function(){ var fp=document.getElementById("filterPanel"); if(fp) fp.classList.remove("show"); });

function goBolum(key){
  ["yeni","odeme","kargo","iptal","arsiv","urunler"].forEach(function(k){
    document.getElementById("body-"+k).classList.toggle("show",k===key);
  });
}

function calcTotal(order){
  var t=0;
  if(order.items) order.items.forEach(function(it){ t+=(it.qty||0)*(it.fiyat||0); });
  return t;
}

function waLink(tel,msg){
  var n=tel.replace(/\D/g,"");
  return "https://wa.me/"+(n.startsWith("90")?n:"90"+n)+"?text="+encodeURIComponent(msg);
}

function addProduct(){
  var adV=document.getElementById("ad").value.trim();
  var fiyatV=document.getElementById("fiyat").value.trim();
  var resimV=document.getElementById("resim").value.trim();
  var katV=document.getElementById("kategori").value;
  var renk1V=document.getElementById("renk1").value.trim();
  var renk2V=document.getElementById("renk2").value.trim();
  if(!adV||!fiyatV){ alert("Ad ve Fiyat giriniz!"); return; }
  var data={ ad:adV, fiyat:parseFloat(fiyatV), resim:resimV, category:katV, aktif:true };
  if(renk1V) data.renk1=renk1V;
  if(renk2V) data.renk2=renk2V;
  db.collection("products").add(data);
  document.getElementById("ad").value="";
  document.getElementById("fiyat").value="";
  document.getElementById("resim").value="";
  document.getElementById("renk1").value="";
  document.getElementById("renk2").value="";
}

function toggleProductStatus(idx){
  var p=products[idx]; if(!p) return;
  db.collection("products").doc(p.id).update({ aktif:!(p.aktif!==false) });
}

function deleteProduct(idx){
  var p=products[idx]; if(!p) return;
  if(confirm("Silinsin mi?")) db.collection("products").doc(p.id).delete();
}

function silSiparis(docId){
  if(confirm("Silinsin mi?")) db.collection("orders").doc(docId).delete();
}

function nextStatus(docId){
  var o=allOrders.find(function(x){ return x._docId===docId; }); if(!o) return;
  var map={yeni:"odeme",odeme:"kargo",kargo:"arsiv"};
  var newStatus=map[o.status||"yeni"]; if(!newStatus) return;
  var update={status:newStatus};
  if(newStatus==="arsiv") update.arsivTarihi=new Date().toLocaleDateString("tr-TR");
  db.collection("orders").doc(docId).update(update);
}

function iptalEt(docId){
  if(confirm("İptal edilsin mi?")){
    db.collection("orders").doc(docId).update({ status:"iptal", iptalTarihi:new Date().toLocaleDateString("tr-TR") });
  }
}

function printOrder(docId){
  var o=allOrders.find(function(x){ return x._docId===docId; }); if(!o) return;
  var win=window.open("","_blank");
  var html="<h2>HAMRA AKSESUAR SİPARİŞ</h2><hr>Müşteri: "+(o.customer&&o.customer.isim?o.customer.isim:"")+"<br>Tel: "+(o.customer&&o.customer.telefon?o.customer.telefon:"")+"<br>Adres: "+(o.customer&&o.customer.adres?o.customer.adres:"")+"<br><hr>";
  if(o.items) o.items.forEach(function(it){ html+="<div>"+it.ad+" - "+it.qty+" Adet - "+it.fiyat+"₺</div>"; });
  html+="<hr><h3>Toplam: "+calcTotal(o)+"₺</h3><script>window.print();<\/script>";
  win.document.write(html); win.document.close();
}

function toggleOrder(docId){
  var body=document.getElementById("obody-"+docId);
  var arrow=document.getElementById("oarrow-"+docId);
  if(!body) return;
  var isOpen=body.classList.contains("show");
  body.classList.toggle("show",!isOpen);
  arrow.classList.toggle("open",!isOpen);
}

function buildCard(order){
  var total=calcTotal(order);
  var status=order.status||"yeni";
  var tel=order.customer&&order.customer.telefon?order.customer.telefon:"";
  var isim=order.customer&&order.customer.isim?order.customer.isim:"";
  var adres=order.customer&&order.customer.adres?order.customer.adres:"";
  var docId=order._docId;
  var siparisNo=order.id||docId;
  var statusEmoji=status==="yeni"?"🟠":status==="odeme"?"🟡":status==="kargo"?"🟣":"📦";

  var html='<div class="orderCard">';
  html+='<div class="orderHeader" onclick="toggleOrder(\''+docId+'\')">';
  html+='<div class="orderHeaderLeft">';
  html+='<div class="orderHeaderTitle">'+statusEmoji+' '+siparisNo+'</div>';
  html+='<div class="orderHeaderSub">👤 '+isim+' | 📞 '+tel+'</div>';
  html+='</div>';
  html+='<div class="orderHeaderRight">';
  html+='<span class="orderTotal">'+total+'₺</span>';
  html+='<span class="orderArrow" id="oarrow-'+docId+'">▼</span>';
  html+='</div></div>';
  html+='<div class="orderBody" id="obody-'+docId+'">';
  html+='<div style="padding-top:10px;font-size:12px;color:#aaa;">📍 '+adres+'</div><hr style="border-color:#333;margin:8px 0;">';

  if(order.items) order.items.forEach(function(it){
    var src=it.resim||"https://via.placeholder.com/60";
    html+='<div class="orderItem"><img src="'+src+'" onclick="openZoom(\''+src.replace(/'/g,"\\'")+'\')"><div><b>'+it.ad+'</b><br>'+it.qty+' adet x '+it.fiyat+'₺</div></div>';
  });

  var waOdeme=waLink(tel,"Merhaba "+isim+", siparişiniz hazırlandı 🛍️\nÖdeme bekliyoruz.\nToplam: "+total+"₺");
  var waKargo=waLink(tel,"Merhaba "+isim+", siparişiniz kargoya verildi! 📦");

  var nextBtn="",waBtn="";
  if(status==="yeni") nextBtn='<button class="nextBtn nextBtn-yeni" onclick="nextStatus(\''+docId+'\')">🟡 Ödeme Bekleyene Taşı →</button>';
  if(status==="odeme"){ nextBtn='<button class="nextBtn nextBtn-odeme" onclick="nextStatus(\''+docId+'\')">🟣 Kargoya Ver →</button>'; waBtn='<a class="waBtn" href="'+waOdeme+'" target="_blank">💬 WhatsApp - Ödeme İste</a>'; }
  if(status==="kargo"){ nextBtn='<button class="nextBtn primary" onclick="nextStatus(\''+docId+'\')">📁 Arşive Gönder</button>'; waBtn='<a class="waBtn" href="'+waKargo+'" target="_blank">💬 WhatsApp - Kargo Bilgisi</a>'; }

  html+='<hr style="border-color:#333;margin:8px 0;"><b>💰 TOPLAM: '+total+'₺</b>';
  html+=nextBtn+waBtn;
  html+='<button onclick="printOrder(\''+docId+'\')" style="margin-top:6px;background:#444;color:white;">🖨 Yazdır</button>';
  html+='<button class="iptalBtn" onclick="iptalEt(\''+docId+'\')">❌ İptal Et</button>';
  html+='<button onclick="silSiparis(\''+docId+'\')" style="margin-top:6px;background:#2d3436;color:#ff7675;border:1px solid #ff7675;border-radius:8px;padding:10px;width:100%;font-size:13px;font-weight:bold;cursor:pointer;">🗑 Siparişi Sil</button>';
  html+='</div></div>';
  return html;
}

function render(){
  document.getElementById("totalProducts").innerText=products.length;
  document.getElementById("count-urunler").innerText=products.length;
  document.getElementById("totalMoney").innerText=calcMoney()+"₺";

  var key=document.getElementById("searchOrder").value.toLowerCase();

  var p="";
  products.forEach(function(x,i){
    var isAktif=x.aktif!==false;
    var src=x.resim||"https://via.placeholder.com/150";
    p+='<div class="card" style="padding:8px;">';
    p+='<img class="productImage '+(isAktif?'':'pasif-img')+'" src="'+src+'" onclick="openZoom(\''+src.replace(/'/g,"\\'")+'\')">'; 
    p+='<div style="margin-top:5px;font-weight:bold;font-size:12px;">'+x.ad+'</div>';
    p+='<div style="color:#c4848e;font-weight:bold;">'+x.fiyat+'₺</div>';
    p+='<button class="'+(isAktif?'primary':'passiveBtn')+'" onclick="toggleProductStatus('+i+')">'+(isAktif?'🟢 Aktif':'🔴 Pasif')+'</button>';
    p+='<button class="deleteBtn" onclick="deleteProduct('+i+')">🗑 Sil</button>';
  p+='</div>';
  });
  document.getElementById("products").innerHTML=p;

  var yeniList=allOrders.filter(function(o){ return (o.status||"yeni")==="yeni"; });
  var odemeList=allOrders.filter(function(o){ return o.status==="odeme"; });
  var kargoList=allOrders.filter(function(o){ return o.status==="kargo"; });
  var iptalList=allOrders.filter(function(o){ return o.status==="iptal"; });
  var arsivList=allOrders.filter(function(o){ return o.status==="arsiv"; });

  function applySearch(list){ return list.filter(function(o){ return (o.customer&&o.customer.isim?o.customer.isim:"").toLowerCase().includes(key)||(o.customer&&o.customer.telefon?o.customer.telefon:"").toLowerCase().includes(key); }); }

  document.getElementById("totalOrders").innerText=yeniList.length+odemeList.length+kargoList.length;
  document.getElementById("count-yeni").innerText=yeniList.length;
  document.getElementById("count-odeme").innerText=odemeList.length;
  document.getElementById("count-kargo").innerText=kargoList.length;
  document.getElementById("count-iptal").innerText=iptalList.length;
  document.getElementById("count-arsiv").innerText=arsivList.length;

  var empty="<p style='color:#666;padding:10px;font-size:12px;'>Kayıt bulunamadı.</p>";

  document.getElementById("body-yeni").innerHTML=applySearch(yeniList).length?applySearch(yeniList).map(buildCard).join(""):empty;
  document.getElementById("body-odeme").innerHTML=applySearch(odemeList).length?applySearch(odemeList).map(buildCard).join(""):empty;
  document.getElementById("body-kargo").innerHTML=applySearch(kargoList).length?applySearch(kargoList).map(buildCard).join(""):empty;

  document.getElementById("body-iptal").innerHTML=applySearch(iptalList).length
    ?applySearch(iptalList).map(function(o){ return '<div class="arsivRow"><div><b>👤 '+(o.customer&&o.customer.isim?o.customer.isim:"")+'</b><div class="detail">📞 '+(o.customer&&o.customer.telefon?o.customer.telefon:"")+'</div><div class="detail">📅 '+(o.iptalTarihi||"İptal")+'</div></div><div style="display:flex;align-items:center;gap:8px;"><div class="tutar" style="color:#d63031;">'+calcTotal(o)+'₺</div><button onclick="silSiparis(\''+o._docId+'\')" style="background:#d63031;color:white;border:none;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:bold;cursor:pointer;width:auto;margin:0;">🗑</button></div></div>'; }).join("")
    :empty;

  document.getElementById("body-arsiv").innerHTML=applySearch(arsivList).length
    ?applySearch(arsivList).map(function(o){ return '<div class="arsivRow"><div><b>👤 '+(o.customer&&o.customer.isim?o.customer.isim:"")+'</b><div class="detail">📞 '+(o.customer&&o.customer.telefon?o.customer.telefon:"")+'</div><div class="detail">📅 '+(o.arsivTarihi||"Arşiv")+' | '+calcTotal(o)+'₺</div></div><div style="display:flex;align-items:center;gap:8px;"><div class="tutar">'+calcTotal(o)+'₺</div><button onclick="silSiparis(\''+o._docId+'\')" style="background:#636e72;color:white;border:none;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:bold;cursor:pointer;width:auto;margin:0;">🗑</button></div></div>'; }).join("")
    :empty;
}
</script>
</body>
</html>
