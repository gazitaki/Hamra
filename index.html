<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hamra Aksesuar</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#fdf0f2;
  --bg2:#ffffff;
  --bg3:#fae4e7;
  --border:#f0cdd2;
  --gold:#8b1a2f;
  --gold2:#a02035;
  --white:#2c1015;
  --gray:#9e7070;
  --red:#e74c3c;
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }

body{
  font-family:'Lato',sans-serif;
  background:var(--bg);
  color:var(--white);
  min-height:100vh;
  overflow-x:hidden;
}

.header{
  position:sticky; top:0; z-index:100;
  background:rgba(253,240,242,.97);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:14px 16px;
  display:flex; align-items:center; justify-content:space-between;
  box-shadow:0 2px 8px rgba(139,26,47,.08);
}
.logo{
  font-family:'Playfair Display',serif;
  font-size:20px; font-weight:700;
  color:var(--gold); letter-spacing:3px;
}
.logo span{ color:var(--white); font-weight:400; font-size:17px; }

.cartBtn{
  position:relative;
  background:var(--bg3); border:1px solid var(--border);
  border-radius:12px; padding:8px 14px;
  font-size:12px; font-weight:700; color:var(--white);
  cursor:pointer; display:flex; align-items:center; gap:6px;
  font-family:'Lato',sans-serif; letter-spacing:1px;
}
.cartBtn:hover{ border-color:var(--gold); }
.cartBadge{
  position:absolute; top:-6px; right:-6px;
  background:var(--gold); color:#fff;
  font-size:10px; font-weight:700;
  width:18px; height:18px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}
.cartBadge.hide{ display:none; }

.catsWrap{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
}
.cats{
  display:flex; gap:8px; overflow-x:auto; padding:10px 16px;
  scrollbar-width:none;
}
.cats::-webkit-scrollbar{ display:none; }
.cat{
  flex-shrink:0; padding:7px 16px; border-radius:20px;
  border:1px solid var(--border); font-size:12px; font-weight:700;
  color:var(--gray); cursor:pointer; background:var(--bg);
  white-space:nowrap; letter-spacing:1px; font-family:'Lato',sans-serif;
}
.cat:hover{ border-color:var(--gold); color:var(--gold); }
.cat.active{ background:var(--gold); border-color:var(--gold); color:#fff; }

.sortRow{
  display:flex; justify-content:flex-end;
  padding:6px 16px 8px; background:var(--bg2);
  border-bottom:1px solid var(--border);
  position:relative;
}
.sortBtn{
  padding:5px 12px; border-radius:20px; border:1px solid var(--border);
  font-size:11px; font-weight:700; color:var(--white); background:var(--bg);
  letter-spacing:1px; cursor:pointer;
}
.sortPanel{
  display:none; position:absolute; top:36px; right:16px;
  background:white; border:1px solid var(--border);
  border-radius:12px; overflow:hidden; z-index:200;
  min-width:160px; box-shadow:0 4px 16px rgba(139,26,47,.1);
}
.sortOption{
  padding:10px 16px; font-size:13px; font-weight:600;
  cursor:pointer; border-bottom:1px solid var(--border);
  color:var(--white); font-family:'Lato',sans-serif;
}
.sortOption:last-child{ border-bottom:none; }
.sortOption.active{ color:var(--gold); }

.grid{
  display:grid; grid-template-columns:repeat(2,1fr);
  gap:10px; padding:12px; padding-bottom:80px;
}
.productCard{
  background:var(--bg2); border:1px solid var(--border);
  border-radius:16px; overflow:hidden;
  box-shadow:0 2px 12px rgba(139,26,47,.07);
  transition:transform .15s;
}
.productCard:active{ transform:scale(.98); }
.productImg{
  width:100%; aspect-ratio:1; object-fit:cover;
  background:var(--bg3); display:block; cursor:pointer;
}
.productInfo{ padding:10px; }
.productName{
  font-family:'Playfair Display',serif;
  font-size:13px; font-weight:600; color:var(--white);
  margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.productCat{ font-size:10px; color:var(--gray); margin-bottom:8px; letter-spacing:1.5px; text-transform:uppercase; }
.productBottom{ display:flex; align-items:center; justify-content:space-between; }
.productPrice{
  font-family:'Playfair Display',serif;
  font-size:18px; font-weight:700; color:var(--gold);
}
.qtyControl{ display:flex; align-items:center; gap:5px; }
.qBtn{
  width:28px; height:28px; border:1px solid var(--border);
  border-radius:8px; background:var(--bg3); color:var(--white);
  font-size:16px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-weight:700; flex-shrink:0;
}
.qBtn:hover{ border-color:var(--gold); color:var(--gold); }
.qBtn.active{ background:var(--gold); border-color:var(--gold); color:#fff; }
.qNum{
  font-size:14px; font-weight:700; width:36px;
  text-align:center; border:none; background:transparent;
  color:var(--white); font-family:'Lato',sans-serif;
}
.qNum:focus{ outline:1px solid var(--gold); border-radius:4px; }

.overlay{
  display:none; position:fixed; inset:0;
  background:rgba(44,16,21,.6); z-index:150; backdrop-filter:blur(4px);
}
.overlay.show{ display:block; }

.cartPanel{
  position:fixed; bottom:0; left:0; right:0;
  background:var(--bg2); border-top:1px solid var(--border);
  border-radius:20px 20px 0 0;
  padding:16px 16px 30px;
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  z-index:200; max-height:88vh; overflow-y:auto;
  box-shadow:0 -4px 20px rgba(139,26,47,.1);
}
.cartPanel.open{ transform:translateY(0); }
.cartHandle{ width:40px; height:4px; background:#ddd; border-radius:2px; margin:0 auto 16px; }
.cartTitle{
  font-family:'Playfair Display',serif;
  font-size:22px; font-weight:700; margin-bottom:14px; color:var(--gold);
}
.cartItem{ display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
.cartItemImg{ width:52px; height:52px; border-radius:10px; object-fit:cover; background:var(--bg3); flex-shrink:0; }
.cartItemInfo{ flex:1; min-width:0; }
.cartItemName{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:'Playfair Display',serif; }
.cartItemSub{ font-size:12px; color:var(--gold); margin-top:2px; }
.cartItemRemove{ color:var(--red); font-size:20px; cursor:pointer; padding:4px 6px; flex-shrink:0; }
.cartEmpty{ text-align:center; padding:30px 0; color:var(--gray); }
.cartEmpty div{ font-size:40px; margin-bottom:8px; }
.cartTotal{
  display:flex; justify-content:space-between; align-items:center;
  margin:14px 0; padding:14px; background:var(--bg3);
  border-radius:12px; border:1px solid var(--border);
}
.cartTotalLabel{ font-size:13px; color:var(--gray); letter-spacing:1px; }
.cartTotalPrice{ font-family:'Playfair Display',serif; font-size:26px; font-weight:700; color:var(--gold); }

.formSection{ margin-bottom:10px; }
.formLabel{ font-size:11px; font-weight:700; color:var(--gray); letter-spacing:1px; text-transform:uppercase; margin-bottom:5px; display:block; }
.formInput{
  width:100%; padding:12px 14px; background:var(--bg3);
  border:1px solid var(--border); border-radius:12px;
  color:var(--white); font-family:'Lato',sans-serif;
  font-size:15px; transition:border-color .2s; -webkit-appearance:none;
}
.formInput:focus{ outline:none; border-color:var(--gold); }
.formInput::placeholder{ color:#c4a0a5; }
.formInput.error{ border-color:var(--red); }

.sendBtn{
  width:100%; padding:16px; background:var(--gold);
  color:#fff; border:none; border-radius:14px;
  font-family:'Lato',sans-serif; font-size:15px; font-weight:700;
  cursor:pointer; letter-spacing:1px; transition:all .2s; margin-top:6px;
}
.sendBtn:hover{ background:var(--gold2); }
.sendBtn:active{ transform:scale(.98); }
.sendBtn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

.cartBar{
  position:fixed; bottom:0; left:0; right:0;
  background:var(--gold); padding:14px 20px;
  display:flex; align-items:center; justify-content:space-between;
  cursor:pointer; z-index:140;
  box-shadow:0 -2px 12px rgba(139,26,47,.2);
}
.cartBar.empty{ background:#c4a0a5; pointer-events:none; }
.cartBarLeft{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:14px; color:#fff; letter-spacing:1px; }
.cartBarCount{ background:rgba(255,255,255,.3); padding:2px 8px; border-radius:20px; font-size:12px; }
.cartBarPrice{ font-family:'Playfair Display',serif; font-size:20px; font-weight:700; color:#fff; }

.thankModal{
  display:none; position:fixed; inset:0;
  background:rgba(253,240,242,.97); z-index:500;
  flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:30px;
}
.thankModal.show{ display:flex; }
.thankIcon{ font-size:64px; margin-bottom:16px; animation:pop .4s cubic-bezier(.34,1.56,.64,1); }
.thankTitle{ font-family:'Playfair Display',serif; font-size:28px; font-weight:700; color:var(--gold); margin-bottom:8px; }
.thankSub{ font-size:14px; color:var(--gray); line-height:1.6; }
.thankCode{ margin:20px 0; padding:14px 24px; background:var(--bg3); border:1px solid var(--border); border-radius:12px; font-size:13px; }
.thankCode b{ color:var(--gold); font-size:18px; display:block; margin-top:4px; }
.thankBtn{ background:var(--gold); color:#fff; border:none; border-radius:14px; padding:14px 32px; font-family:'Lato',sans-serif; font-size:15px; font-weight:700; cursor:pointer; margin-top:8px; letter-spacing:1px; }

.zoomModal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.97); z-index:300; justify-content:center; align-items:center; touch-action:none; }
.zoomModal.show{ display:flex; }
.zoomModal img{ max-width:95vw; max-height:95vh; object-fit:contain; border-radius:10px; transform-origin:center; }
.zoomClose{ position:absolute; top:14px; right:14px; width:38px; height:38px; background:white; color:#111; border:none; border-radius:50%; font-size:20px; font-weight:900; cursor:pointer; display:flex; align-items:center; justify-content:center; }

@keyframes pop{ 0%{ transform:scale(0); } 100%{ transform:scale(1); } }
</style>
</head>
<body>

<div class="header">
  <div class="logo">HAMRA <span>AKSESUAR</span></div>
  <button class="cartBtn" onclick="openCart()">
    🛍 Sepet
    <span class="cartBadge hide" id="cartBadge">0</span>
  </button>
</div>

<div class="catsWrap">
  <div class="cats">
    <div class="cat active" onclick="filterCat('Xuping',this)">Xuping</div>
    <div class="cat" onclick="filterCat('CM',this)">CM</div>
    <div class="cat" onclick="filterCat('Set',this)">Set</div>
    <div class="cat" onclick="filterCat('Küpe',this)">Küpe</div>
    <div class="cat" onclick="filterCat('Kolye',this)">Kolye</div>
    <div class="cat" onclick="filterCat('Bileklik',this)">Bileklik</div>
    <div class="cat" onclick="filterCat('VIP',this)">VIP</div>
  </div>
  <div class="sortRow">
    <div class="sortBtn" id="sortBtn" onclick="toggleSort(event)">↕ Sırala</div>
    <div class="sortPanel" id="sortPanel">
      <div class="sortOption active" onclick="setSort('az',this)">🔤 A-Z</div>
      <div class="sortOption" onclick="setSort('asc',this)">⬆️ Fiyat Artan</div>
      <div class="sortOption" onclick="setSort('desc',this)">⬇️ Fiyat Azalan</div>
    </div>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="cartBar empty" id="cartBar" onclick="openCart()">
  <div class="cartBarLeft">🛍 Sepetim <span class="cartBarCount" id="cartBarCount">0 ürün</span></div>
  <div class="cartBarPrice" id="cartBarPrice">0₺</div>
</div>

<div class="overlay" id="overlay" onclick="closeCart()"></div>

<div class="cartPanel" id="cartPanel">
  <div class="cartHandle"></div>
  <div class="cartTitle">🛍 Sepetim</div>
  <div id="cartItems"></div>
  <div class="cartTotal">
    <span class="cartTotalLabel">TOPLAM</span>
    <span class="cartTotalPrice" id="cartTotalPrice">0₺</span>
  </div>
  <div class="formSection">
    <label class="formLabel">İsim Soyisim</label>
    <input class="formInput" id="isim" placeholder="Adınızı girin">
  </div>
  <div class="formSection">
    <label class="formLabel">Telefon</label>
    <input class="formInput" id="telefon" placeholder="05xx xxx xx xx" type="tel">
  </div>
  <div class="formSection">
    <label class="formLabel">Adres</label>
    <input class="formInput" id="adres" placeholder="Teslimat adresi">
  </div>
  <button class="sendBtn" id="sendBtn" onclick="sendOrder()">📦 Siparişi Gönder</button>
</div>

<div class="thankModal" id="thankModal">
  <div class="thankIcon">🎉</div>
  <div class="thankTitle">Siparişiniz Alındı!</div>
  <div class="thankSub">WhatsApp üzerinden onay mesajı gönderilecek.</div>
  <div class="thankCode">Sipariş Kodunuz<b id="thankCode">—</b></div>
  <button class="thankBtn" onclick="closeThank()">🛍 Alışverişe Devam Et</button>
</div>

<div class="zoomModal" id="zoomModal" onclick="closeZoom()">
  <button class="zoomClose" onclick="closeZoom()">×</button>
  <img id="zoomImg" onclick="event.stopPropagation()">
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>

firebase.initializeApp({
  apiKey: "AIzaSyCurf07V_eEA3Oi1x-zY0MsD8kzZSamOjA",
  authDomain: "hamra-78810.firebaseapp.com",
  projectId: "hamra-78810",
  storageBucket: "hamra-78810.firebasestorage.app",
  messagingSenderId: "7432272923",
  appId: "1:7432272923:web:262ec502e15bb6e8bf0cbe"
});
const db = firebase.firestore();

let products = [];
let cart = {};
let activeCat = "Xuping";
let activeSort = "az";
let sending = false;

function saveCart(){ try{ localStorage.setItem("hamraCart", JSON.stringify(cart)); }catch(e){} }
function loadCart(){ try{ var s=localStorage.getItem("hamraCart"); if(s) cart=JSON.parse(s); }catch(e){} }

function img(url){
  if(!url||url.trim()==="") return "https://via.placeholder.com/300";
  if(url.includes("drive.google.com")){
    let m=url.match(/[-\w]{25,}/);
    if(m&&m[0]) return "https://drive.google.com/thumbnail?id="+m[0]+"&sz=w800";
  }
  if(url.startsWith("http://")||url.startsWith("https://")) return url;
  return "https://via.placeholder.com/300";
}

async function loadData(){
  try{
    const snapshot = await db.collection("products").get();
    products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    products = products.filter(p => p.aktif !== false);
    renderGrid();
  }catch(e){ console.error(e); }
}

function filterCat(cat,el){
  activeCat=cat;
  document.querySelectorAll(".cat").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  renderGrid();
}

function toggleSort(e){
  e.stopPropagation();
  var panel=document.getElementById("sortPanel");
  panel.style.display=panel.style.display==="block"?"none":"block";
}

function setSort(type,el){
  activeSort=type;
  document.querySelectorAll(".sortOption").forEach(o=>o.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("sortPanel").style.display="none";
  renderGrid();
}

document.addEventListener("click",function(){ document.getElementById("sortPanel").style.display="none"; });

function renderGrid(){
  let filtered=products.filter(p=>p.category===activeCat);
  if(activeSort==="az") filtered.sort((a,b)=>a.ad.localeCompare(b.ad,"tr"));
  else if(activeSort==="asc") filtered.sort((a,b)=>a.fiyat-b.fiyat);
  else if(activeSort==="desc") filtered.sort((a,b)=>b.fiyat-a.fiyat);

  if(!filtered.length){
    document.getElementById("grid").innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--gray)">Bu kategoride ürün yok</div>';
    return;
  }

  document.getElementById("grid").innerHTML=filtered.map(p=>{
    const id=p.id||p.ad;
    const renk1=p.renk1||"";
    const renk2=p.renk2||"";
    var varyantHTML="";

    if(renk1||renk2){
      if(renk1){
        const vid=id+"__"+renk1;
        const vqty=cart[vid]?cart[vid].qty:0;
        varyantHTML+='<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-top:1px solid var(--border);">'
          +'<span style="font-size:11px;font-weight:700;color:var(--gray);letter-spacing:1px;">'+renk1+'</span>'
          +'<div class="qtyControl">'
          +'<div class="qBtn '+(vqty>0?'active':'')+'" onclick="minus(\''+vid+'\')">−</div>'
          +'<input type="number" min="0" id="qnum-'+vid+'" value="'+vqty+'" class="qNum" onchange="setQty(\''+vid+'\',\''+p.ad+' - '+renk1+'\','+p.fiyat+',\''+( p.resim||"")+'\',\''+p.category+'\',this.value)">'
          +'<div class="qBtn active" onclick="plus(\''+vid+'\',\''+p.ad+' - '+renk1+'\','+p.fiyat+',\''+(p.resim||"")+'\',\''+p.category+'\')">+</div>'
          +'</div></div>';
      }
      if(renk2){
        const vid=id+"__"+renk2;
        const vqty=cart[vid]?cart[vid].qty:0;
        varyantHTML+='<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-top:1px solid var(--border);">'
          +'<span style="font-size:11px;font-weight:700;color:var(--gray);letter-spacing:1px;">'+renk2+'</span>'
          +'<div class="qtyControl">'
          +'<div class="qBtn '+(vqty>0?'active':'')+'" onclick="minus(\''+vid+'\')">−</div>'
          +'<input type="number" min="0" id="qnum-'+vid+'" value="'+vqty+'" class="qNum" onchange="setQty(\''+vid+'\',\''+p.ad+' - '+renk2+'\','+p.fiyat+',\''+(p.resim||"")+'\',\''+p.category+'\',this.value)">'
          +'<div class="qBtn active" onclick="plus(\''+vid+'\',\''+p.ad+' - '+renk2+'\','+p.fiyat+',\''+(p.resim||"")+'\',\''+p.category+'\')">+</div>'
          +'</div></div>';
      }
      return '<div class="productCard">'
        +'<img class="productImg" src="'+img(p.resim)+'" onclick="openZoom(\''+img(p.resim)+'\')">'
        +'<div class="productInfo">'
        +'<div class="productName">'+p.ad+'</div>'
        +'<div class="productCat">'+p.category+'</div>'
        +'<div class="productPrice">'+p.fiyat+'₺</div>'
        +varyantHTML
        +'</div></div>';
    } else {
      const qty=cart[id]?cart[id].qty:0;
      return '<div class="productCard">'
        +'<img class="productImg" src="'+img(p.resim)+'" onclick="openZoom(\''+img(p.resim)+'\')">'
        +'<div class="productInfo">'
        +'<div class="productName">'+p.ad+'</div>'
        +'<div class="productCat">'+p.category+'</div>'
        +'<div class="productBottom">'
        +'<div class="productPrice">'+p.fiyat+'₺</div>'
        +'<div class="qtyControl">'
        +'<div class="qBtn '+(qty>0?'active':'')+'" onclick="minus(\''+id+'\')">−</div>'
        +'<input type="number" min="0" id="qnum-'+id+'" value="'+qty+'" class="qNum" onchange="setQty(\''+id+'\',\''+p.ad+'\','+p.fiyat+',\''+(p.resim||"")+'\',\''+p.category+'\',this.value)">'
        +'<div class="qBtn active" onclick="plus(\''+id+'\',\''+p.ad+'\','+p.fiyat+',\''+(p.resim||"")+'\',\''+p.category+'\')">+</div>'
        +'</div></div></div></div>';
    }
  }).join("");
}

function plus(id,ad,fiyat,resim,category){
  if(!cart[id]) cart[id]={id,ad,fiyat,resim,category,qty:0};
  cart[id].qty++;
  saveCart(); updateCartUI(); renderGrid();
}
function minus(id){
  if(!cart[id]) return;
  cart[id].qty--;
  if(cart[id].qty<=0) delete cart[id];
  saveCart(); updateCartUI(); renderGrid();
}
function setQty(id,ad,fiyat,resim,category,val){
  const qty=parseInt(val)||0;
  if(qty<=0){ delete cart[id]; }
  else { if(!cart[id]) cart[id]={id,ad,fiyat,resim,category,qty:0}; cart[id].qty=qty; }
  saveCart(); updateCartUI(); renderGrid();
}
function removeItem(id){ delete cart[id]; saveCart(); updateCartUI(); renderGrid(); renderCartItems(); }

function cartCount(){ return Object.values(cart).reduce((s,i)=>s+i.qty,0); }
function cartTotal(){ return Object.values(cart).reduce((s,i)=>s+(i.qty*i.fiyat),0); }

function updateCartUI(){
  const count=cartCount(); const total=cartTotal();
  const badge=document.getElementById("cartBadge");
  badge.innerText=count; badge.classList.toggle("hide",count===0);
document.getElementById("cartTotalPrice").innerText=total+"₺";
  const bar=document.getElementById("cartBar");
  document.getElementById("cartBarCount").innerText=count+" ürün";
  document.getElementById("cartBarPrice").innerText=total+"₺";
  if(count===0){ bar.classList.add("empty"); } else { bar.classList.remove("empty"); }
}

function renderCartItems(){
  const items=Object.values(cart);
  const el=document.getElementById("cartItems");
  if(!items.length){ el.innerHTML='<div class="cartEmpty"><div>🛒</div>Sepetiniz boş</div>'; return; }
  el.innerHTML=items.map(it=>'<div class="cartItem">'
    +'<img class="cartItemImg" src="'+img(it.resim)+'">'
    +'<div class="cartItemInfo">'
    +'<div class="cartItemName">'+it.ad+'</div>'
    +'<div class="cartItemSub">'+it.qty+' adet × '+it.fiyat+'₺ = '+(it.qty*it.fiyat)+'₺</div>'
    +'</div>'
    +'<div class="cartItemRemove" onclick="removeItem(\''+it.id+'\')">×</div>'
    +'</div>').join("");
}

function openCart(){ renderCartItems(); updateCartUI(); document.getElementById("cartPanel").classList.add("open"); document.getElementById("overlay").classList.add("show"); }
function closeCart(){ document.getElementById("cartPanel").classList.remove("open"); document.getElementById("overlay").classList.remove("show"); }

async function sendOrder(){
  if(sending) return;
  const items=Object.values(cart);
  if(!items.length){ alert("Sepetiniz boş!"); return; }
  const isim=document.getElementById("isim").value.trim();
  const telefon=document.getElementById("telefon").value.trim();
  const adres=document.getElementById("adres").value.trim();
  let valid=true;
  [["isim",isim],["telefon",telefon],["adres",adres]].forEach(([id,val])=>{
    const el=document.getElementById(id);
    if(!val){ el.classList.add("error"); valid=false; } else el.classList.remove("error");
  });
  if(!valid){ alert("Lütfen tüm alanları doldurun!"); return; }
  const telClean=telefon.replace(/\D/g,"");
  if(telClean.length<10){ document.getElementById("telefon").classList.add("error"); alert("Geçerli bir telefon numarası girin!"); return; }
  sending=true;
  const btn=document.getElementById("sendBtn");
  btn.disabled=true; btn.innerText="Gönderiliyor...";
  const orderId="ORD-"+Date.now().toString().slice(-5);
  try{
    await db.collection("orders").add({ id:orderId, date:new Date().toISOString(), status:"yeni", customer:{isim,telefon,adres}, items });
  }catch(e){ alert("Hata oluştu, tekrar deneyin."); sending=false; btn.disabled=false; btn.innerText="📦 Siparişi Gönder"; return; }
  let msg="🧾 SİPARİŞ NO: "+orderId+"\n\n👤 "+isim+"\n📞 "+telefon+"\n📍 "+adres+"\n\n";
  let totalPrice=0;
  items.forEach(p=>{ totalPrice+=p.qty*p.fiyat; msg+="• "+p.ad+" - "+p.qty+" adet - "+(p.qty*p.fiyat)+"₺\n"; });
  msg+="\n💰 TOPLAM: "+totalPrice+"₺";
  document.getElementById("thankCode").innerText=orderId;
  document.getElementById("thankModal").classList.add("show");
  closeCart();
  setTimeout(()=>{ window.location.href="https://wa.me/905397932181?text="+encodeURIComponent(msg); },1500);
  cart={}; saveCart(); sending=false; btn.disabled=false; btn.innerText="📦 Siparişi Gönder";
  document.getElementById("isim").value=""; document.getElementById("telefon").value=""; document.getElementById("adres").value="";
  renderGrid(); updateCartUI();
}

function closeThank(){ document.getElementById("thankModal").classList.remove("show"); }

let zScale=1, zStartDist=0, zLastScale=1;
function openZoom(src){ const el=document.getElementById("zoomImg"); el.src=src; zScale=1; el.style.transform="scale(1)"; document.getElementById("zoomModal").classList.add("show"); document.body.style.overflow="hidden"; }
function closeZoom(){ document.getElementById("zoomModal").classList.remove("show"); document.body.style.overflow=""; zScale=1; document.getElementById("zoomImg").style.transform="scale(1)"; }
function getDist(t){ let dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }

document.addEventListener("DOMContentLoaded",()=>{
  const el=document.getElementById("zoomImg");
  el.addEventListener("touchstart",(e)=>{ if(e.touches.length===2){ zStartDist=getDist(e.touches); zLastScale=zScale; } });
  el.addEventListener("touchmove",(e)=>{ if(e.touches.length===2){ e.preventDefault(); const nd=getDist(e.touches); zScale=Math.max(1,Math.min(zLastScale*(nd/zStartDist),8)); el.style.transform="scale("+zScale+")"; } });
});

loadCart();
loadData();
setInterval(loadData,30000);
</script>
